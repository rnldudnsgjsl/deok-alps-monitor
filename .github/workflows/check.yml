name: Deok Alps vacancy check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deok-alps-vacancy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check vacancy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py


      - name: Test ntfy on manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -H "Title: 등억알프스 알림 테스트" \
               -H "Priority: high" \
               -H "Click: https://camping.ulju.ulsan.kr/ujcamping/campsite/booking" \
               -d "GitHub 서버에서 보낸 테스트입니다. 휴대폰 알림이 정상 작동합니다." \
               "https://ntfy.sh/$NTFY_TOPIC"
